<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>LEDERG — Network</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, Arial, sans-serif; background: #090909; color: #f4f4f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: radial-gradient(ellipse at 50% 0%, #2a080b 0, #090909 52%); }
    main { width: min(100%, 560px); padding: 38px; border: 1px solid #342124; border-radius: 22px; background: #101010; box-shadow: 0 24px 80px #0009; }
    .mark { color: #ff3347; font-size: 13px; letter-spacing: .28em; font-weight: 800; }
    h1 { margin: 18px 0 8px; font-size: clamp(32px, 7vw, 48px); letter-spacing: -.05em; }
    p { color: #aaa; line-height: 1.65; margin: 0; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 28px; color: #d7d7d7; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3347; box-shadow: 0 0 14px #ff3347; }
    footer { margin-top: 36px; color: #696969; font-size: 11px; letter-spacing: .13em; }
  </style>
</head>
<body>
  <main>
    <div class="mark">LEDERG NETWORK</div>
    <h1>Private by design.</h1>
    <p>Сетевой сервис LEDERG. Защищённый транспорт доступен только совместимым клиентам Telegram WEB Proxy.</p>
    <div class="status"><span class="dot"></span> Gateway online</div>
    <footer>LEDERG · TELEGRAM WEB PROXY NODE</footer>
  </main>
</body>
</html>
